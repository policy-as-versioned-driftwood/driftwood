name: shift-left policy check

# Ticket mo-10: platform/shift-left/ci-check.py (see platform's own README)
# run for real, cross-org -- driftwood and platform checked out side by side
# in one run, TWO SEPARATE GitHub orgs, no monorepo assumption. This is the
# real shape `ci-workflow.example.yml` in the platform repo documents; this
# file is that shape actually wired into an institution's own CI, as that
# file says every institution must do for itself.
#
# No `paths:` filter: this check must report a status on every PR (including
# a Renovate bump PR that only touches gitops/platform/platform-pin.yaml, not
# deploy/pod.yaml) -- a required check gated by `paths:` never runs on a PR
# that doesn't touch those paths, and GitHub then blocks the merge forever
# waiting on a status that was never going to arrive (the same gotcha
# faithful-floor ticket 12 hit and fixed the same way).
#
# Ticket mo-10 follow-up (2026-08-21): a green check on this job used to be
# the whole signal. That is not independently verifiable by a human reviewer
# -- it says "GitHub ran a job", not "the gate actually ran and passed". The
# steps after the gate build a small JSON attestation, sign it keyless (same
# Fulcio-from-Actions-OIDC, logged-to-Rekor pattern cut-release.yml already
# proves out for release tags) and post the signed result as a PR comment,
# so the reviewer can verify the check independently of trusting the badge.
#
# cs-28: two live bugs fixed here, plus the adopter gate itself
# (.github/scripts/adopter-gate.py). This job used to check out platform's
# DEFAULT BRANCH, not the tag under review -- so a Renovate bump pull request
# that moves gitops/platform/platform-pin.yaml never actually tested the
# version it was proposing. It now reads that pin from driftwood's own
# PR-head content, checks platform out at that exact tag, and refuses unless
# the resolved commit matches the pin's own `commit` field -- ADR-0001's pin,
# made load-bearing instead of decorative. The adopter gate then verifies
# platform's cs-27 signed evidence (identity-pinned to a constant driftwood
# holds itself, never read from platform) and composes driftwood's own bump
# across the versions gitops/platform/platform-pin.yaml pins -- see
# adopter-gate.py's own module docstring for why that is platform's bump,
# re-verified, and not general cross-party composition (out of scope).
#
# cs-29: the same verified evidence renders into the pull request BODY
# itself -- the literal thing the ticket's title and first acceptance
# criterion name ("the pull request body carries the evidence document").
# An earlier draft posted this as a PR comment instead, reasoning that
# Renovate authors and can overwrite the PR body on its own re-runs; a
# reviewer correctly flagged that as not satisfying the ticket's own words.
# That race doesn't actually apply: this job is triggered BY a
# `pull_request` event, which only fires after Renovate has already pushed
# and settled its own body content for that push, so the step below always
# reads and splices onto text Renovate already finished writing, never
# races it. adopter-gate.py wraps its rendered markdown between two
# HTML-comment markers (SECTION_START/SECTION_END, see the script); the
# step fetches the PR's current body, replaces whatever already sits
# between those markers (a re-run on the same PR) or appends the marked
# section (first run), and writes the result back with `gh pr edit`.
# Renovate's own body content is never touched, only the gate's own span.

on: [pull_request]

# Extra permissions past the read-only default: the attestation step signs
# keyless via this run's own Actions identity (needs the ambient OIDC
# credential), and the comment step posts to the pull request. An explicit
# permissions block zeroes every unlisted permission rather than defaulting
# it, so both lines below are real grants, not restating what already held.
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  shift-left:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: driftwood }

      - name: install pyyaml (adopter-gate.py needs it early, to read the platform pin)
        run: pip install --quiet pyyaml

      - name: read the platform pin -- the tag under review (PR head) and the tag it replaces (PR base)
        id: pin
        run: |
          set -euo pipefail
          python3 driftwood/.github/scripts/adopter-gate.py read-pin \
            driftwood/gitops/platform/platform-pin.yaml | sed 's/^/head_/' >> "$GITHUB_OUTPUT"
          git -C driftwood fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git -C driftwood show "${{ github.event.pull_request.base.sha }}:gitops/platform/platform-pin.yaml" \
            | python3 driftwood/.github/scripts/adopter-gate.py read-pin /dev/stdin | sed 's/^/base_/' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: checkout platform AT THE TAG UNDER REVIEW (bug fix #1 -- not the default branch)
        uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          path: platform
          ref: ${{ steps.pin.outputs.head_tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: verify platform's checked-out commit against the pin (bug fix #2 -- the pin is load-bearing)
        run: python3 driftwood/.github/scripts/adopter-gate.py verify-commit platform "${{ steps.pin.outputs.head_commit }}"

      - name: party artefact check (ticket 11) -- schema, pinned tags, baseline mirror
        # platform/party/party_artefact.py, called through the pinned platform
        # dependency this job already checked out above -- the same "library,
        # not a service" shape ci-check.py uses. Refuses if party.yaml is
        # structurally invalid, if a declared implementations/controls version
        # disagrees with what gitops/platform/platform-pin.yaml or
        # gitops/flux-system/gotk-sync-nist.yaml actually pin, or if
        # gitops/apps/nist-pin-configmap.yaml's baselineName disagrees with
        # party.yaml's own baseline.
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 platform/party/party_artefact.py check driftwood/party.yaml --adopter-dir driftwood

      - name: install pinned kyverno cli (binary + checksum, no marketplace action)
        env:
          KYVERNO_VERSION: 1.18.2
          KYVERNO_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
        run: |
          set -euo pipefail
          curl -sSL -o kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          tar xzf kyverno.tar.gz kyverno && chmod +x kyverno && sudo mv kyverno /usr/local/bin/kyverno
          pip install --quiet pyyaml

      - name: version cross-check gate
        run: python3 platform/shift-left/ci-check.py --resource driftwood/deploy/pod.yaml

      - name: install pinned cosign (binary + checksum, no marketplace action)
        env:
          COSIGN_VERSION: 3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          set -euo pipefail
          curl -sSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign && sudo mv cosign /usr/local/bin/cosign

      - name: adopter gate -- verify platform's signed evidence and compose driftwood's own bump (cs-28)
        # Does NOT recompute the publisher's answer (spec.md). Verifies
        # platform's cs-27 evidence for every policy version this pull
        # request's platform-pin bump would ADD to driftwood's supported
        # window, identity-pinned against EXPECTED_PLATFORM_IDENTITY_REGEXP
        # (a literal constant adopter-gate.py holds itself, not read from
        # platform), then composes: any RETIRED version is always major, and
        # the strictest of every added version's own recorded computed_bump
        # otherwise wins. A composed major fails this step for real (a
        # non-zero exit, not a print). A composed bump weaker than the
        # publisher's own declared bump prints (see the JSON `reasons`) and
        # never lowers anything -- there is no override, at any scope.
        #
        # ticket 18 / ADR-0011: --adopter-dir/--base-ref/--head-ref make
        # driftwood's own composed/evidence.json member set the subject
        # (versions_from_composed_evidence), not platform's raw
        # distribution/versions.yaml array directly -- "the composed bump is
        # computed after composition." base.sha is already fetched above
        # (the platform-pin read step). --head-ref is literally HEAD, not
        # github.event.pull_request.head.sha: actions/checkout on a
        # pull_request event checks out GitHub's own synthetic merge commit
        # (refs/pull/N/merge), shallow -- head.sha itself is never fetched
        # as a separately addressable commit, so `git show <head.sha>:...`
        # fails even though the very same content sits in the working tree
        # right now. HEAD always resolves to whatever is actually checked
        # out, merge commit included.
        run: |
          set -uo pipefail
          python3 driftwood/.github/scripts/adopter-gate.py compose \
            platform "${{ steps.pin.outputs.base_tag }}" "${{ steps.pin.outputs.head_tag }}" \
            --adopter-dir driftwood \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref HEAD \
            --out adopter-gate-evidence.json --markdown-out adopter-gate-comment.md \
            2>&1 | tee adopter-gate-output.txt
          status=${PIPESTATUS[0]}
          exit "${status}"

      # Ticket 43 (18 Answer 4): the per-institution matrix row is filled HERE,
      # by the adopter, with platform's PUBLISHED computed-semver package, run
      # against this institution's own claimed policy versions with its own
      # workloads added to the generated corpus. The publisher's own matrix
      # stays empty and says so -- NORTH-STAR §2 forbids platform reading this
      # repository. The row lands in composed/evidence.json; the PR carries it
      # like every other composed change, and a human merges.
      - name: fill this institution's own per-institution matrix row (ticket 43)
        run: |
          set -euo pipefail
          python3 driftwood/.github/scripts/adopter-gate.py matrix-row \
            platform --adopter-dir driftwood

      - name: render the adopter-gate evidence into the pull request BODY (cs-29 -- the body itself, not a comment)
        # An earlier draft posted this as a PR COMMENT, reasoning Renovate
        # authors and can overwrite the PR body on its own re-runs -- a
        # reviewer correctly flagged that as not satisfying the ticket's own
        # title and first acceptance-criterion line ("the pull request body
        # carries the evidence document"). This now edits the body for
        # real: it fetches the PR's CURRENT body (`gh pr view --json body`,
        # so it always reads whatever Renovate most recently wrote -- this
        # job is triggered BY the `pull_request` event Renovate's own push
        # raises, so it never races Renovate's write), then splices the
        # rendered evidence between adopter-gate.py's own SECTION_START/
        # SECTION_END markers -- replacing a prior run's span in place, or
        # appending if this is the first run on this PR -- and writes the
        # result back with `gh pr edit --body-file`. `if: always()` so a
        # refusal's own evidence reaches the reviewer too (spec.md: "the
        # gate emits and signs the evidence when it refuses, not only when
        # it passes... a refusal is the most valuable output the gate
        # produces").
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f adopter-gate-comment.md ]; then
            {
              echo "### adopter gate: platform's evidence, composed for driftwood"
              echo
              cat adopter-gate-comment.md
            } > adopter-gate-section-raw.md
          else
            {
              echo "### adopter gate: platform's evidence, composed for driftwood -- REFUSED"
              echo
              echo "The adopter gate refused before producing a rendered evidence document."
              echo "Raw output:"
              echo
              echo '```'
              cat adopter-gate-output.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
            } > adopter-gate-section-raw.md
          fi
          python3 driftwood/.github/scripts/adopter-gate.py wrap-section \
            --in adopter-gate-section-raw.md --out adopter-gate-section.md
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json body -q .body > current-body.md
          python3 driftwood/.github/scripts/adopter-gate.py splice-body \
            --current-body current-body.md --section adopter-gate-section.md --out-body new-body.md
          gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file new-body.md

      - name: build the shift-left attestation
        # Only reached if the gate step above exited 0 -- the attestation
        # claims "pass" because a non-zero ci-check.py already stopped the
        # job before this step runs.
        run: |
          set -euo pipefail
          printf '{\n' > attestation.json
          printf '  "pr_number": %s,\n' "${{ github.event.pull_request.number }}" >> attestation.json
          printf '  "head_sha": "%s",\n' "${{ github.event.pull_request.head.sha }}" >> attestation.json
          printf '  "gate": "shift-left",\n' >> attestation.json
          printf '  "result": "pass",\n' >> attestation.json
          printf '  "run_id": "%s",\n' "${{ github.run_id }}" >> attestation.json
          printf '  "run_url": "%s"\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> attestation.json
          printf '}\n' >> attestation.json
          cat attestation.json

      - name: sign the attestation keyless (Fulcio cert from this run's own OIDC identity, logged to Rekor)
        run: cosign sign-blob --yes --bundle attestation.cosign.bundle attestation.json

      - name: post the signed attestation as a PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### shift-left gate: signed attestation"
            echo
            echo "\`platform/shift-left/ci-check.py\` passed for this PR. The JSON below is"
            echo "signed keyless -- a Fulcio certificate bound to this run's own GitHub"
            echo "Actions OIDC identity, logged to the public Rekor transparency log -- so"
            echo "this is an independently verifiable 'this was checked' signal, not just a"
            echo "green status badge."
            echo
            echo '```json'
            cat attestation.json
            echo '```'
            echo
            echo "Signature bundle (certificate + signature + Rekor log entry -- verify with"
            echo "\`cosign verify-blob --bundle attestation.cosign.bundle ...\`):"
            echo
            echo '```json'
            cat attestation.cosign.bundle
            echo '```'
          } > pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file pr-comment.md

  compose-check:
    # Ticket 18 (policy-composition): each adopter's shift-left check
    # recomposes on every pull request -- not just a Renovate bump PR, any
    # PR, so this job also has no `paths:` filter, exactly the shift-left
    # job's own reasoning above. It regenerates the composed artefact and
    # the evidence document (ticket 12), fails on any diff against the
    # committed copies, fails on refusal, and prints the document as the
    # job summary (spec.md: "a refusal is the most valuable output the gate
    # produces").
    #
    # Three parents checked out at driftwood's own pinned tags: platform
    # (implementations + threat, same pin shift-left's own job reads), nist
    # (controls, gitops/flux-system/gotk-sync-nist.yaml), and ico (pricing --
    # no Flux/Renovate pin exists for this kind anywhere in this estate
    # today, party_artefact.py's own NOTE says so plainly, so it checks out
    # at its default branch, matching composition.py's own unpinned-parent
    # handling).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { path: driftwood }

      - name: read driftwood's own pinned platform and nist tags
        # Self-contained -- each adopter's own adopter-gate.py CLI has
        # evolved independently (ticket cs-28's own module docstring: built
        # per adopter) and their read-pin-shaped subcommands are not
        # uniform, so this reads the two GitRepository pin files directly
        # rather than depending on any adopter's own script shape.
        id: pins
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 driftwood/.github/scripts/read-two-pins.py \
            driftwood/gitops/platform/platform-pin.yaml platform \
            driftwood/gitops/flux-system/gotk-sync-nist.yaml nist \
            >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-platform/platform
          fetch-depth: 0
          path: platform
          ref: ${{ steps.pins.outputs.platform_tag }}

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-nist/nist
          fetch-depth: 0
          path: nist
          ref: ${{ steps.pins.outputs.nist_tag }}

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-ico/ico
          fetch-depth: 0
          path: ico
          ref: main

      # The two parents ticket 21 added. `party.yaml` inherits feed/threat-register
      # from `feeds` and, through the insurer's quote, from `insurer` -- but this
      # job only ever checked out platform, nist and ico, so composition had no
      # tree for either and refused:
      #     feeds/feed@v1: no parent tree provided
      #     insurer/feed@v1: no parent tree provided
      # A parent that is declared and not fetched is a refusal, which is the
      # honest outcome; the repair is to fetch it, not to stop declaring it.
      # `main` matches the ico line above: neither repo cuts a tag this adopter
      # pins yet, and when one does, this ref moves to that pin with the others.
      # Ticket 57 renamed both repos' default branch from ecosystem/thin-slice
      # to main (2026-09-01); ticket 61 moved these refs with it, and ticket 62
      # owns replacing them with real pins.
      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-feeds/feeds
          fetch-depth: 0
          path: feeds
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: policy-as-versioned-insurer/insurer
          fetch-depth: 0
          path: insurer
          ref: main

      - name: recompose driftwood's party artefact; fail on refusal or drift; print the document as the job summary
        run: |
          set -uo pipefail
          pip install --quiet pyyaml
          python3 platform/compose/composition.py compose driftwood --estate-clone . --out driftwood \
            2>&1 | tee compose-output.json
          status=${PIPESTATUS[0]}
          {
            echo "## composition check"
            echo
            echo '```json'
            cat compose-output.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::composition refused -- see the job summary for the full document"
            exit 1
          fi
          drift="$(git -C driftwood status --porcelain -- composed/)"
          if [ -n "$drift" ]; then
            echo "::error::the regenerated composed artefact differs from the committed copy under driftwood/composed/"
            echo "$drift"
            git -C driftwood --no-pager diff -- composed/ | head -400
            exit 1
          fi
          echo "composed artefact matches the committed copy -- no drift"
