name: twin-sweep

# driftwood's own twin, on a clock (ticket 28; ADR-0024, decisions D1 and D2;
# ADR-0021). 07:05 UTC, driftwood's own choice. No cross-org ordering is
# promised: the hub's truth run at 05:47 grades whatever state it finds, and
# every joint in the chain waits on a human merge anyway.
#
# The sweep re-renders driftwood's forward-intel feed from driftwood's own
# overlay and then takes exactly one of two paths, never both:
#
#   the render still matches  ->  APPEND one JSON line to
#                                 observations/twin-sweep.jsonl on main. That is
#                                 an observation: a dated record that the twin
#                                 looked and the scenario had not moved, so a
#                                 flat series survives for scoring instead of
#                                 being lost to "nothing happened".
#   the render has moved      ->  OPEN a pull request carrying the re-rendered
#                                 feed and the re-derived signal lookup. A
#                                 published feed is a DECLARATION, and a clock
#                                 never commits one (D1). A human merges, and a
#                                 human dispatches cut-release.yml, exactly as
#                                 the feeds repo's own fetch clock works (D2).
#                                 Then, back on the default branch, APPEND the
#                                 same observation line with moved=true and the
#                                 proposal branch: the series carries a line for
#                                 every sweep, and twin/verify-twin-sweep-moved.sh
#                                 reads that line as the proof this path has run
#                                 (ticket 72: it had never run -- see the sweep
#                                 step).
#
# TWO JOBS, NOT ONE (eco-system ticket 143; ADR-0031 point 4). Until this the one
# job ran the hub's twin code under `contents: write`, and it checked the hub out
# at `main`: whatever landed on another party's default branch ran here with this
# repository's write token. Now:
#
#   twin   holds `contents: read` and nothing else. It checks driftwood out, reads
#          the hub commit twin/PIN.yaml names, checks the hub out at exactly that
#          commit, runs the emitter and the lookup, and hands ONE artifact to the
#          writer: the observation line, plus the two proposal files when the
#          render moved. It pushes nothing and cannot.
#   write  holds the write token. It has no hub checkout and runs no program from
#          any checkout: inline shell, git, gh and jq only, so the hub's
#          verify/schedules/schedules.py reads every line it executes. It refuses
#          the artifact by name unless every path and every shape is exactly what
#          the twin job may hand over, and only then commits gitsign-signed and
#          pushes exactly as the one job did before.
#
# THE PIN. twin/PIN.yaml names the hub commit whose twin code renders this
# overlay. driftwood moves it by a reviewed pull request, never by a clock. When
# the signed `twin/v0.1.0` tag exists, the tag replaces the commit in the pin
# and in the checkout below. The emitter's own check that `twin_version` is the
# hub's twin/VERSION stays as it was.
#
# EVERY DOWNLOAD IS PINNED BY HASH (ADR-0031 point 4): each `uses:` names a full
# commit, with its version beside it; pip installs from a hash-pinned
# requirements file; gitsign is a checksummed binary, as before.
#
# The observation commit is gitsign-signed by this workflow's own Actions
# identity -- the same keyless OIDC -> Fulcio -> Rekor chain cut-release.yml
# already uses for tags. With .github/rulesets/observation-lane.json applied, an
# unsigned commit, or a signed one touching a declaration path, is refused by
# the server and not by good manners (a push ruleset cannot be applied on a
# public repository today, so the cage step below and the hub's checker are the
# whole cage; .github/rulesets/README.md says so).
#
# ponytail: the sweep is the forward-intel re-render, the only twin output this
# repository has today. Ticket 29 lands the scenario library and the scored
# sweep; when it does, the twin job runs `twin sweep` and the observation line
# grows the scores. The clock, the cage and the two paths do not change.

on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch: {}

# The default for every job. The twin job runs the twin code under this and no
# more; the write job declares its own, below, and is the only job that can push.
permissions:
  contents: read

# Trimmed 2026-09-06 (eco-system ticket 67 item (c)): this list was the hub's four-path
# lane, copied verbatim into twelve unit workflows across eight repositories. It named paths
# this repository has never owned. That is not cosmetic: the hub's verify/schedules/lane.py
# grades every commit a scheduled identity lands HERE against the union of THIS repository's own
# declarations, so each copied path was one a clock here could land and be graded green for. It
# now names only what this repository owns, which every commit a clock has landed here already
# fits. Graded by the hub's verify/map-surface/verify-map-surface.sh.
# The observation lane, declared once as data so the cage step and
# verify/schedules/verify-schedules.sh read the SAME list (ADR-0024, D1). These
# are the only paths any scheduled job in this repository may ever commit.
env:
  OBSERVATION_LANE: "observations"
  # The two paths a moved render may propose, declared once so the twin job's
  # handoff, the writer's validation and the writer's proposal read one list.
  PROPOSAL_PATHS: "twin/forward-intel/v1/feed.json twin/signals.yaml"
  # The same pin .github/actions/install-gitsign/action.yml carries; a test under
  # .github/tests/ fails when the two disagree.
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae

jobs:
  # --- the twin job: reads, renders, hands off; pushes nothing ----------------
  twin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        # Every twin step runs inside driftwood's checkout. It sits under the hub
        # checkout at the exact path clone-estate.sh assembles, because
        # twin/emit-forward-intel.py finds the `twin` package by walking UPWARDS
        # from the overlay. The first three steps set that layout up and name
        # their own working directory, because this one does not exist yet.
        working-directory: hub/.estate-clone/driftwood
    steps:
      # driftwood first, at the top of the workspace: the pin has to be read
      # before the hub can be checked out at it, and actions/checkout empties a
      # directory that is not already a checkout of the same repository, so
      # nesting driftwood under hub/ before hub/ exists would lose it.
      - name: checkout driftwood, whose twin/PIN.yaml names the twin code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: adopter
          fetch-depth: 0
          persist-credentials: false

      - name: read the hub commit twin/PIN.yaml names
        id: pin
        working-directory: adopter
        run: |
          set -euo pipefail
          if [ "$(grep -c '^hub_commit:' twin/PIN.yaml)" != 1 ]; then
            echo "::error::twin/PIN.yaml must carry exactly one hub_commit line"
            exit 1
          fi
          commit="$(sed -n 's/^hub_commit:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' twin/PIN.yaml)"
          if ! [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::twin/PIN.yaml hub_commit is not a full 40-hex commit"
            exit 1
          fi
          echo "hub_commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "ok  twin/PIN.yaml pins the twin code at policy-as-versioned-flux@${commit}"

      - name: checkout the hub at that commit, and at nothing else
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: policy-as-versioned-flux/policy-as-versioned-flux
          path: hub
          ref: ${{ steps.pin.outputs.hub_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: put driftwood where the emitter finds the twin package, and prove the hub is at the pin
        working-directory: ${{ github.workspace }}
        env:
          HUB_COMMIT: ${{ steps.pin.outputs.hub_commit }}
        run: |
          set -euo pipefail
          mkdir -p hub/.estate-clone
          mv adopter hub/.estate-clone/driftwood
          head="$(git -C hub rev-parse HEAD)"
          if [ "${head}" != "${HUB_COMMIT}" ]; then
            echo "::error::the hub checkout is at ${head}, not at the pinned ${HUB_COMMIT}"
            exit 1
          fi
          echo "ok  twin code is policy-as-versioned-flux@${head}, the commit twin/PIN.yaml names"

      - name: install the twin job's one package, hash-pinned
        run: |
          set -euo pipefail
          pip install --quiet --require-hashes -r .github/requirements/twin-sweep.txt

      - name: sweep -- re-render the forward-intel feed from driftwood's own overlay
        id: sweep
        run: |
          set -euo pipefail
          # `set +e` around the two checks, and nothing else lifts it. GitHub runs
          # this step as `bash -e {0}`, and the old body's `set -uo pipefail` did
          # not turn -e off -- so the exit 1 that MEANS "moved" aborted the step
          # before rc=$? could read it, and the moved branch below never ran
          # once (run 33627910027, 2026-09-02; ticket 72). Exit 1 is a reading,
          # not a failure; anything above 1 is a render or lookup that could not
          # be made at all, and that fails the run.
          set +e
          python3 twin/emit-forward-intel.py --check; feed_rc=$?
          python3 .github/scripts/rederive-signals.py --check; lookup_rc=$?
          set -e
          if [ "${feed_rc}" -gt 1 ] || [ "${lookup_rc}" -gt 1 ]; then
            echo "::error::the sweep could not render the overlay or derive the lookup (feed exit ${feed_rc}, lookup exit ${lookup_rc})"
            exit 1
          fi
          if [ "${feed_rc}" -eq 0 ] && [ "${lookup_rc}" -eq 0 ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi
          echo "swept_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The render happens here, where the twin code is, and goes into the
      # handoff. The checkout is put back as it was: this job proposes nothing
      # itself, and it could not push a branch if it tried.
      - name: render the moved scenario into the handoff (a feed is a declaration; the writer proposes it)
        if: steps.sweep.outputs.moved == 'true'
        env:
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          python3 twin/emit-forward-intel.py
          python3 .github/scripts/rederive-signals.py
          for path in ${PROPOSAL_PATHS}; do
            mkdir -p "${HANDOFF}/proposal/$(dirname "${path}")"
            cp -- "${path}" "${HANDOFF}/proposal/${path}"
          done
          for path in ${PROPOSAL_PATHS}; do git checkout -q -- "${path}"; done

      # Unconditional on the reading: the series carries a line for every sweep,
      # moved or not. A moved=true line is the only offline evidence the moved
      # path has ever run (ticket 72), and a flat series is what makes a later
      # move scoreable at all. The line is written here, by the twin code's job,
      # and appended by the writer once it has validated every field.
      - name: observe -- one dated line into the handoff, for the writer to append
        env:
          SWEPT_AT: ${{ steps.sweep.outputs.swept_at }}
          MOVED: ${{ steps.sweep.outputs.moved }}
          HUB_COMMIT: ${{ steps.pin.outputs.hub_commit }}
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          mkdir -p "${HANDOFF}"
          proposal=""
          if [ "${MOVED}" = "true" ]; then proposal="twin/forward-intel-${SWEPT_AT%%T*}"; fi
          PROPOSAL="${proposal}" ADOPTER_REF="$(git rev-parse HEAD)" python3 - > "${HANDOFF}/observation.jsonl" <<'PY'
          import json, os
          print(json.dumps({
              "swept_at": os.environ["SWEPT_AT"],
              "org": "driftwood",
              "feed": "forward-intel",
              "moved": os.environ["MOVED"] == "true",
              "proposal": os.environ["PROPOSAL"],
              "twin_ref": "policy-as-versioned-flux@" + os.environ["HUB_COMMIT"],
              "adopter_ref": os.environ["ADOPTER_REF"],
              "run": os.environ.get("GITHUB_RUN_ID", ""),
          }, sort_keys=True))
          PY
          cat "${HANDOFF}/observation.jsonl"

      - name: hand the observation and any proposal to the writer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twin-sweep-handoff
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 7

  # --- the write job: no hub checkout, no program from any checkout ------------
  write:
    needs: twin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: take the handoff from the twin job (this run's artifact, nothing else)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: twin-sweep-handoff
          path: ${{ runner.temp }}/handoff

      - name: checkout driftwood, the only checkout this job has
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Every path and every shape, before anything is written. A file the twin
      # job may not hand over fails the run by name; so does a line that does not
      # name this run, this repository, this feed, the commit twin/PIN.yaml pins
      # (read from THIS checkout, not from the artifact) or a commit this
      # repository has.
      - name: validate the handoff -- every path and every shape, before anything is written
        id: handoff
        env:
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          fail() { echo "::error::the handoff is refused: $*"; exit 1; }
          allowed=" observation.jsonl"
          for path in ${PROPOSAL_PATHS}; do allowed="${allowed} proposal/${path}"; done
          allowed="${allowed} "
          while IFS= read -r f; do
            case "${allowed}" in
              *" ${f} "*) ;;
              *) fail "${f} is neither the observation nor a proposal path" ;;
            esac
          done < <(cd "${HANDOFF}" && find . -type f | sed 's|^\./||' | LC_ALL=C sort)
          obs="${HANDOFF}/observation.jsonl"
          [ -f "${obs}" ] || fail "no observation.jsonl"
          [ -s "${obs}" ] || fail "observation.jsonl is empty"
          [ "$(tail -c1 "${obs}" | wc -l | tr -d ' ')" = 1 ] || fail "observation.jsonl lacks its final newline"
          lines="$(wc -l < "${obs}" | tr -d ' ')"
          [ "${lines}" = 1 ] || fail "observation.jsonl carries ${lines} line(s), not exactly one"
          jq -e 'type == "object"' "${obs}" >/dev/null || fail "the observation is not one JSON object"
          keys="$(jq -r 'keys | join(" ")' "${obs}")"
          [ "${keys}" = "adopter_ref feed moved org proposal run swept_at twin_ref" ] || fail "the observation carries the keys [${keys}]"
          jq -e --arg run "${GITHUB_RUN_ID}" '.run == $run' "${obs}" >/dev/null || fail "the observation names run $(jq -r .run "${obs}") and this is run ${GITHUB_RUN_ID}"
          jq -e '.org == "driftwood" and .feed == "forward-intel"' "${obs}" >/dev/null || fail "the observation is not driftwood's forward-intel line"
          jq -e '.swept_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")' "${obs}" >/dev/null || fail "swept_at is not a UTC timestamp"
          jq -e '.moved | type == "boolean"' "${obs}" >/dev/null || fail "moved is not a boolean"
          jq -e '.adopter_ref | test("^[0-9a-f]{40}$")' "${obs}" >/dev/null || fail "adopter_ref is not a full commit"
          adopter_ref="$(jq -r .adopter_ref "${obs}")"
          git cat-file -e "${adopter_ref}^{commit}" 2>/dev/null || fail "adopter_ref ${adopter_ref} is not a commit this repository has"
          pin="$(sed -n 's/^hub_commit:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' twin/PIN.yaml)"
          [[ "${pin}" =~ ^[0-9a-f]{40}$ ]] || fail "twin/PIN.yaml in this checkout carries no hub_commit"
          jq -e --arg want "policy-as-versioned-flux@${pin}" '.twin_ref == $want' "${obs}" >/dev/null || fail "twin_ref $(jq -r .twin_ref "${obs}") is not the pinned policy-as-versioned-flux@${pin}"
          moved="$(jq -r .moved "${obs}")"
          proposal="$(jq -r .proposal "${obs}")"
          swept_at="$(jq -r .swept_at "${obs}")"
          if [ "${moved}" = "true" ]; then
            [ "${proposal}" = "twin/forward-intel-${swept_at%%T*}" ] || fail "moved is true and proposal is '${proposal}', not the sweep's own branch name"
            for path in ${PROPOSAL_PATHS}; do
              [ -f "${HANDOFF}/proposal/${path}" ] || fail "moved is true and the handoff carries no proposal/${path}"
              [ -s "${HANDOFF}/proposal/${path}" ] || fail "proposal/${path} is empty"
              [ "$(tr -d '\000' < "${HANDOFF}/proposal/${path}" | wc -c)" = "$(wc -c < "${HANDOFF}/proposal/${path}")" ] || fail "proposal/${path} is not text"
            done
            jq -e 'type == "object"' "${HANDOFF}/proposal/twin/forward-intel/v1/feed.json" >/dev/null || fail "the proposed feed is not one JSON object"
          else
            [ -z "${proposal}" ] || fail "moved is false and proposal is '${proposal}'"
            [ ! -e "${HANDOFF}/proposal" ] || fail "moved is false and the handoff carries a proposal"
          fi
          echo "moved=${moved}" >> "$GITHUB_OUTPUT"
          echo "proposal=${proposal}" >> "$GITHUB_OUTPUT"
          echo "ok  the handoff is one observation line for run ${GITHUB_RUN_ID}$( [ "${moved}" = true ] && echo " and a proposal on ${proposal}" )"

      - name: install pinned gitsign (binary + checksum, outside the checkout, no marketplace action)
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/gitsign" "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  ${RUNNER_TEMP}/gitsign" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitsign-bin"
          install -m 755 "${RUNNER_TEMP}/gitsign" "${RUNNER_TEMP}/gitsign-bin/gitsign"
          rm -f "${RUNNER_TEMP}/gitsign"
          echo "${RUNNER_TEMP}/gitsign-bin" >> "$GITHUB_PATH"

      - name: propose the moved scenario as a pull request (a feed is a declaration)
        id: propose
        if: steps.handoff.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.handoff.outputs.proposal }}
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          branch="${BRANCH}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "${branch} already open -- nothing to propose"; exit 0
          fi
          git checkout -b "${branch}"
          for path in ${PROPOSAL_PATHS}; do
            cp -- "${HANDOFF}/proposal/${path}" "${path}"
          done
          for path in ${PROPOSAL_PATHS}; do git add -- "${path}"; done
          if git diff --cached --quiet; then
            echo "the proposed render is byte-identical to ${GITHUB_REF_NAME} -- nothing to propose"
            git checkout -q "${GITHUB_REF_NAME}"
            exit 0
          fi
          git -c gpg.format=x509 -c gpg.x509.program=gitsign \
            -c user.name="driftwood twin agent" \
            -c user.email="twin-agent@policy-as-versioned-driftwood.invalid" \
            commit -S -m "twin: the forward-intel scenario moved on the daily sweep"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "twin: forward-intel re-rendered by the daily sweep" \
            --body "$(printf '%s\n' \
              "The daily sweep re-rendered driftwood's forward-intel feed from driftwood's own overlay and the bytes moved (and, if a pin had moved under it, re-derived twin/signals.yaml)." \
              "" \
              "A published feed is a **declaration**, so the clock proposes it and never commits it (ADR-0024, D1)." \
              "Merging publishes nothing: dispatch \`cut-release.yml\` to sign the tag." \
              "" \
              "The render was made by the read-only twin job at the hub commit twin/PIN.yaml pins and handed to the writer as an artifact (eco-system ticket 143)." \
              "" \
              "There is no recommended action in this payload and there never will be (ADR-0021): the twin emits a scenario, the estate selects the tier.")"
          # Back to the default branch, clean: the proposal is committed on its
          # own branch, so what is left here is main as checked out. The observe
          # step below appends this sweep's line there, and the cage pushes it.
          git checkout -q "${GITHUB_REF_NAME}"

      - name: observe -- append the one validated line, and only ever append
        env:
          HANDOFF: ${{ runner.temp }}/handoff
        run: |
          set -euo pipefail
          mkdir -p observations
          if [ -s observations/twin-sweep.jsonl ] && [ "$(tail -c1 observations/twin-sweep.jsonl | wc -l | tr -d ' ')" != 1 ]; then
            echo "::error::observations/twin-sweep.jsonl lacks a final newline; refusing to repair history"
            exit 1
          fi
          cat "${HANDOFF}/observation.jsonl" >> observations/twin-sweep.jsonl

      # --- the cage (ADR-0024, D1) -------------------------------------------
      # Everything this sweep may commit to main is staged from OBSERVATION_LANE
      # and nothing else. Anything left in the tree afterwards is a declaration
      # escaping the lane, and this step fails the run rather than pushing it.
      - name: the observation cage -- a clock appends observations, never a declaration
        if: always()
        run: |
          set -euo pipefail
          # HEAD must be the branch this step is about to push to. On the
          # moved==true path the propose step does `git checkout -b twin/...`
          # and this step is `if: always()`, so if that step died before its
          # last line HEAD is still the PROPOSAL branch, feed declaration and
          # all, while the last line pushes HEAD:${GITHUB_REF_NAME} -- the
          # default branch. Nothing but `git diff --cached --quiet` happening
          # to be true kept that branch off main (review, 2026-08-28). The
          # propose step now returns to the default branch itself when it
          # finishes, so the observation line lands on main either way.
          head="$(git rev-parse --abbrev-ref HEAD)"
          if [ "${head}" != "${GITHUB_REF_NAME}" ]; then
            echo "ok  HEAD is ${head}, not ${GITHUB_REF_NAME} -- this run proposed a declaration on its own branch, so the cage commits nothing"
            exit 0
          fi
          # `git reset` FIRST: the cage builds the index and nothing else. The old
          # guard filtered `git status --porcelain` with `grep -v '^[AMD] '`, which
          # strips exactly the staged-and-clean entries -- so a declaration any
          # earlier step had left in the index was committed and pushed while this
          # step printed "this clock declared nothing" (review, 2026-08-28).
          git reset -q
          for path in ${OBSERVATION_LANE}; do
            # -f: talk/captures/ is gitignored for local runs; the clock is the one
            # caller allowed to commit it.
            if [ -e "${path}" ]; then git add -Af -- "${path}"; fi
          done
          # The STAGED set, judged against the same OBSERVATION_LANE list, never a
          # second regex that could drift from it.
          bad=""
          for f in $(git diff --cached --name-only); do
            ok=0
            for path in ${OBSERVATION_LANE}; do
              case "${f}" in "${path}"|"${path}"/*) ok=1 ;; esac
            done
            [ "${ok}" = 1 ] || bad="${bad} ${f}"
          done
          if [ -n "${bad}" ]; then
            echo "::error::this clock staged a declaration outside the observation lane"
            echo "${bad}"
            exit 1
          fi
          outside="$(git status --porcelain --untracked-files=all | grep -v '^[AMD] ' || true)"
          if [ -n "${outside}" ]; then
            echo "::error::the scheduled twin sweep left a change outside the observation lane"
            echo "${outside}"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "ok  nothing to observe, and nothing declared"; exit 0
          fi
          # The signing config goes in the LOCAL CONFIG, not on the one commit
          # command: `git pull --rebase` replays the commit, and with no
          # commit.gpgsign in scope the replay came out UNSIGNED -- exactly in
          # the contended case the pull exists for (review, 2026-08-28).
          git config user.name "driftwood twin sweep"
          git config user.email "twin-sweep@policy-as-versioned-driftwood.invalid"
          git config gpg.format x509
          git config gpg.x509.program gitsign
          git config commit.gpgsign true
          git commit -m "twin sweep: observe the forward-intel scenario [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
