apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: driftwood
  labels:
    app: api
    app.kubernetes.io/part-of: driftwood
    policy-as-versioned.dev/policy-version: "8.0.0"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: api
      image: ghcr.io/policy-as-versioned-driftwood/api:v1.0.1@sha256:90ccb85d903b8137863695681c2cf6b8cb85ba59835be5e24857e72895b977a3
      ports:
        - containerPort: 8080
      securityContext:
        readOnlyRootFilesystem: true
