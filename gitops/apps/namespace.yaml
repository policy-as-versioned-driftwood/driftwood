apiVersion: v1
kind: Namespace
metadata:
  name: driftwood
  labels:
    app.kubernetes.io/part-of: driftwood
    # driftwood is the e-comm / PCI+GDPR institution (Audit-heavy risk skin).
    policy-as-versioned.dev/institution: driftwood
    # The governed declaration (ticket 11, ADR-0014/ADR-0018): this manifest,
    # signed under the same tag as party.yaml, IS the declaration. A workload
    # inside this namespace must claim a policy-version, or a CREATE-only
    # ValidatingPolicy denies it. The composed artefact carries no namespace
    # list of its own -- it only records this set as advisory metadata.
    policy-as-versioned.dev/governed: "true"
