apiVersion: v1
kind: Pod
metadata:
  name: storefront
  namespace: driftwood
  labels:
    app: storefront
    app.kubernetes.io/part-of: driftwood
    policy-as-versioned.dev/policy-version: "8.0.0"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
  containers:
    - name: storefront
      image: ghcr.io/policy-as-versioned-driftwood/storefront:v1.0.1@sha256:6affc441f4181ec9e43976ab4115e8b239fe5a73ba30de8f61f5ff691de303d6
      ports:
        - containerPort: 80
      securityContext:
        readOnlyRootFilesystem: true
      volumeMounts:
        - { name: cache, mountPath: /var/cache/nginx }
        - { name: run, mountPath: /run }
  volumes:
    - { name: cache, emptyDir: {} }
    - { name: run, emptyDir: {} }
