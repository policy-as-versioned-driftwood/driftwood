id: penalty-published-2026
question: >-
  When the regulator publishes a penalty under a regime this company is subject to, what does the
  publication itself do to the checkout — custom lost, brand trust spent — over the horizon?
proposition: a-regulator-publishes-a-penalty-under-a-regime-in-force
at: '2026-08-28'
horizon: '2027-08-28'
components:
  - published-enforcement-record
  - cart-pii
  - checkout-revenue
world_models:
  - reference-map
class: penalty-published
note: >-
  The seam, and it is structural rather than a promise: this scenario prices the consequence on
  the value chain and never the fine. The amount of a fine is computed by the estate from the
  regulator's own published penalty schema, through composition and `prices[]`; a number for it
  here would be the same fine priced twice by two engines answering the same question (ADR-0021).

  And the honest other half: the consequence this question asks about is NOT YET PRICED. This
  overlay carries one graded cash-flow edge, `cart-pii-loss-cuts-checkout-revenue`, and it is the
  exfiltration shock, not the publication shock. `emit-forward-intel.py` never reads this
  directory, so nothing downstream turns this scenario into a figure. Pricing it needs a second
  graded edge from `published-enforcement-record` to `checkout-revenue` and an emitter that emits
  one payload per priced shock; until both exist, read this file as a standing question with a
  register attached and no number behind it.
affected_parties:
  - id: the-data-subjects-the-penalty-is-for
    who: The customers whose cart records the penalty would be imposed over, not represented in this model.
    consequence: A publication this scenario forecasts is priced as this company's lost custom; the twin carries no perspective for the people the regulator fined it on behalf of.
