# The pinned-feed-version -> dated-signal lookup (ticket 29; spec user story 45).
#
# WHY A TABLE AND NOT A HEURISTIC. A clock consumes only committed, reviewed claim files, and
# reasoning is a skill a human runs (ticket 28, ADR-0024). So when the twin sweep asks "what
# changed that I should play forward?", it must not decide. It reads the pins on `party.yaml`,
# looks each one up HERE, and gets back one dated signal and the standing scenario that signal
# moves. A pin with no row is a named hole in this file, reviewed in a pull request like any other
# declaration -- never a guess made at 06:20 UTC.
#
# WHAT A ROW IS. `pin` is the subscription exactly as `party.yaml` `inherits[]` spells it, so the
# lookup key is the pin and not a paraphrase of it. `signal.at` is the pin's own `since` date --
# the dated fact is "this organisation has been subscribed to that version since then", which is
# a fact of the signed party artefact and not an opinion about the publisher. `signal.scenario` is
# an id under `orgs/driftwood/scenarios/`; the binding is many-to-one on purpose, because two
# pinned dependencies can pass an end-of-life date the same way.
#
# WHAT THIS DOES NOT DO. It carries no probability, no elasticity and no price. The scenario
# carries the question; the overlay carries the graded edge; composition carries the pound. A
# lookup that priced anything would be judgement wearing a table's clothes.
#
# ponytail: hand-maintained, and `verify-twin-scenarios.sh` check 8 is what stops it drifting --
# every pin resolves to exactly one row, every row names a scenario that exists, and every
# scenario is either bound here or declared unbound below with its reason. Upgrade path: when
# `renovate-run.yml` moves a pin it edits this file's `version` in the same PR, and the row's
# `signal.at` becomes the merge date.

schema: twin.signal-lookup/v1
version: 1
org: driftwood
pins_read_from: party.yaml

signals:
  - pin: { party: platform, kind: implementations, version: '1.1.1' }
    signal:
      id: platform-implementations-1.1.1-is-the-pinned-release
      at: '2026-08-28'
      scenario: eol-date-passes-2026
      what: >-
        driftwood's cage policy line comes from platform 1.1.1. The end-of-life date for that
        release is the publisher's to publish; this row is what binds it to the standing question
        about a pinned dependency passing one.

  - pin: { party: nist, kind: controls, version: '1.1.0' }
    signal:
      id: nist-controls-1.1.0-is-the-pinned-catalogue
      at: '2026-08-28'
      scenario: eol-date-passes-2026
      what: >-
        The control ids every claim in this repository keys on come from nist 1.1.0. A catalogue
        version can pass its own end-of-life exactly as a policy release can, and it moves the
        same standing question.

  - pin: { party: ico, kind: feed, name: penalty-schema, version: v3 }
    signal:
      id: ico-penalty-schema-v3-is-the-pinned-regime
      at: '2026-08-28'
      scenario: penalty-published-2026
      what: >-
        The regime this organisation is priced under is the one it pins. A penalty published under
        that regime is the dated signal; what it does to the value chain is the scenario, and the
        amount of the fine is the estate's, never the twin's.

  - pin: { party: feeds, kind: feed, name: threat-register, version: v1 }
    signal:
      id: feeds-threat-register-v1-names-driftwood
      at: '2026-08-28'
      scenario: rival-reads-my-holes-2026
      what: >-
        The threat register is a PUBLISHED document naming this organisation's exposure, and the
        subscription is public on the party artefact. That is exactly the standing question about
        a rival reading the published exposure and acting on it.

  - pin: { party: insurer, kind: feed, name: quote-driftwood, version: v1 }
    signal:
      id: insurer-quote-driftwood-v1-is-the-pinned-quote
      at: '2026-08-28'
      scenario: publisher-withdraws-2026
      what: >-
        A quote is a feed like any other and the insurer is a publisher like any other. The
        standing question about a publisher withdrawing a feed this organisation pins is the one
        a withdrawn quote moves.

# Scenarios no subscribed feed version binds. Declared, so that "six scenarios and five rows" is
# an observation rather than a hole somebody has to notice. Neither is feed-derived: no publisher
# publishes a version whose movement is the signal.
unbound_scenarios:
  - scenario: key-person-2026
    why: >-
      A bus-factor-one holder departing is an internal event. It arrives through the roles in this
      overlay, not through anybody's pinned feed version, so there is no version to look up.
  - scenario: niobium-supply-shock-2026
    why: >-
      A tier-one supplier failing to deliver arrives as a dated headline a human classifies with
      the classify-and-judge skill (ticket 50). Binding it to a pin here would be the twin
      deciding on the clock, which is the one thing this table exists to prevent.
